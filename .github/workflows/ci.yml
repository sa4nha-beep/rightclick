name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # DoD5 — Pint format check
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql,redis,intl,bcmath,gd,zip,pcntl
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --no-progress --prefer-dist

      - name: Run Pint
        run: vendor/bin/pint --test

  # DoD5 — PHPStan level 6
  analyse:
    name: Analyse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql,redis,intl,bcmath,gd,zip,pcntl
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --no-progress --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  # DoD1 — Pest test suite
  test:
    name: Test
    runs-on: ubuntu-latest

    # .env.example memakai DB_HOST=db (nama service Docker Compose untuk
    # dev lokal) — di runner GitHub Actions tidak ada jaringan Compose,
    # container `postgres` di atas hanya bisa dijangkau lewat localhost.
    # Variabel job-level ini menimpa .env (vlucas/phpdotenv tidak menimpa
    # env var yang sudah diset di proses induk — pola yang sama dengan bug
    # T1.11 di CLAUDE.md), berlaku di seluruh step job ini.
    #
    # "Setup Laravel" sengaja dipecah jadi step terpisah (Copy .env /
    # Generate app key / Show resolved DB config / Run migrations) — log
    # detail step gagal di GitHub Actions memerlukan sign-in untuk publik,
    # tapi NAMA dan status pass/fail tiap step tetap terlihat tanpa sign-in.
    # Memecahnya membuat step mana yang gagal terlihat tanpa perlu log
    # penuh.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: rightclick
      DB_USERNAME: rightclick
      DB_PASSWORD: rightclick
      # .env.example juga memakai REDIS_HOST=redis (Compose service name) +
      # CACHE_STORE=redis/QUEUE_CONNECTION=redis — job ini tidak punya
      # service Redis (hanya postgres di atas). phpunit.xml SUDAH menimpa
      # CACHE_STORE/QUEUE_CONNECTION ke array/sync untuk `php artisan test`,
      # tapi TIDAK berlaku untuk step "Run migrations" (panggilan artisan
      # polos, bukan lewat PHPUnit) — migration `create_permission_tables`
      # (spatie/laravel-permission) menghapus cache permission saat
      # dijalankan, memicu koneksi Redis nyata yang gagal resolve host
      # "redis". Ditemukan lewat annotation ::error:: eksplisit, bukan
      # dugaan — lihat riwayat commit CI sebelumnya.
      CACHE_STORE: array
      QUEUE_CONNECTION: sync

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rightclick
          POSTGRES_USER: rightclick
          POSTGRES_PASSWORD: rightclick
          POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql,redis,intl,bcmath,gd,zip,pcntl
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Diagnose DB connectivity
        run: |
          RESOLVED_HOST=$(php artisan tinker --execute="echo config('database.connections.pgsql.host');")
          RESOLVED_PORT=$(php artisan tinker --execute="echo config('database.connections.pgsql.port');")
          echo "::notice::Resolved pgsql host=${RESOLVED_HOST} port=${RESOLVED_PORT}"
          OUTPUT=$(php artisan db:show 2>&1) && STATUS=ok || STATUS=fail
          FLAT=$(echo "$OUTPUT" | tr '\n' ' ' | cut -c1-500)
          echo "::notice::db:show ${STATUS}: ${FLAT}"

      - name: Run migrations
        run: |
          set +e
          OUTPUT=$(php artisan migrate --force -v 2>&1)
          CODE=$?
          set -e
          echo "$OUTPUT"
          if [ $CODE -ne 0 ]; then
            FLAT=$(echo "$OUTPUT" | tr '\n' ' ' | cut -c1-900)
            echo "::error::migrate failed (exit $CODE): ${FLAT}"
            exit $CODE
          fi

      - name: Create test database
        run: psql -h localhost -U rightclick -d rightclick -c 'CREATE DATABASE rightclick_testing OWNER rightclick;'
        env:
          PGPASSWORD: rightclick

      # phpunit.xml memaksa DB_DATABASE=rightclick_testing untuk `php
      # artisan test` (B3, CLAUDE.md §18) — tapi step di atas hanya
      # membuat database KOSONG, tidak ada yang pernah memigrasikannya.
      # Tanpa ini, seluruh test yang menyentuh DB jalan di atas skema
      # kosong (tabel `migrations` pun tidak ada) — ditemukan lewat
      # reproduksi lokal yang macet/timeout, bukan pesan error yang jelas.
      - name: Migrate test database
        env:
          DB_DATABASE: rightclick_testing
        run: |
          set +e
          OUTPUT=$(php artisan migrate --force -v 2>&1)
          CODE=$?
          set -e
          echo "$OUTPUT"
          if [ $CODE -ne 0 ]; then
            FLAT=$(echo "$OUTPUT" | tr '\n' ' ' | cut -c1-900)
            echo "::error::migrate (rightclick_testing) failed (exit $CODE): ${FLAT}"
            exit $CODE
          fi

      - name: Run tests
        run: php artisan test

  # DoD5 — composer audit
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --no-progress --prefer-dist

      - name: Audit dependencies
        run: composer audit
