; RIGHTCLICK — konfigurasi PHP
; Nilai disesuaikan dengan perangkat keras sasaran node cabang:
; Intel Core i3-7100, RAM 16 GB (HS-ARCH-RIGHTCLICK-v1.1 bagian 9.6)

memory_limit = 512M
max_execution_time = 60
post_max_size = 24M
upload_max_filesize = 20M

; DB Design 7: seluruh timestamptz DISIMPAN dalam UTC dan hanya DITAMPILKAN
; sebagai Asia/Jakarta. Zona tampilan diatur aplikasi lewat
; config/rightclick.php → display_timezone, bukan di sini.
date.timezone = UTC

; S4 — kata sandi dan secret tidak pernah muncul di log
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

realpath_cache_size = 4096K
realpath_cache_ttl = 600
