; RIGHTCLICK — OPcache
; APP_ENV=local menonaktifkan validate_timestamps akan menyembunyikan perubahan kode,
; karena itu validasi tetap aktif dan hanya interval-nya yang dilonggarkan di produksi.

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.jit = disable
